name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/check-secrets.mjs

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test "tests/node/**/*.test.mjs"

  pester:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run unit tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $r = Invoke-Pester -Path tests/unit -CI -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: pwsh -NoProfile -File tests/lint.ps1

  windows-powershell-5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script under Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem lib, scripts, providers -Filter *.ps1 -Recurse | ForEach-Object {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e)
            if ($e) { $bad++; Write-Host "::error file=$($_.FullName)::$($e[0].Message)" }
          }
          if ($bad) { exit 1 }
